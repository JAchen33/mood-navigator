<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>心情小導航 - 轉念 SEL 情緒方向盤</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Google Fonts: Noto Sans TC (基本字體) & Mali (手繪可愛字體) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Noto Sans TC', 'sans-serif'],
                        hand: ['Mali', 'Noto Sans TC', 'cursive'],
                    },
                    colors: {
                        kid: {
                            bg: '#fcf9f2',
                            red: '#ff7b72',
                            blue: '#79c0ff',
                            purple: '#d2a8ff',
                            green: '#7ee787',
                            yellow: '#f2cc60',
                            text: '#444'
                        },
                        adult: {
                            bg: '#f0ece1',
                            red: '#d98c8c',
                            blue: '#8ca6d9',
                            purple: '#b8a3d1',
                            green: '#9ecfa4',
                            yellow: '#d9c27e',
                            text: '#555'
                        }
                    },
                    boxShadow: {
                        'hand': '4px 6px 0px -1px rgba(0,0,0,0.1)',
                        'hand-hover': '2px 3px 0px -1px rgba(0,0,0,0.1)',
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --color-bg: #fcf9f2;
            --color-text: #444;
            --color-angry: #ff7b72;
            --color-sad: #79c0ff;
            --color-worried: #d2a8ff;
            --color-calm: #7ee787;
            --color-hopeful: #f2cc60;
            --color-border: #444;
        }

        .mode-adult {
            --color-bg: #f0ece1;
            --color-text: #555;
            --color-angry: #d98c8c;
            --color-sad: #8ca6d9;
            --color-worried: #b8a3d1;
            --color-calm: #9ecfa4;
            --color-hopeful: #d9c27e;
            --color-border: #5a5a5a;
        }

        body {
            background-color: var(--color-bg);
            color: var(--color-text);
            /* 手繪水彩紙張質感的背景圖案 (SVG Base64) */
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
            transition: background-color 0.5s ease;
            overscroll-behavior-y: none;
        }

        /* 手繪風格邊框 */
        .hand-drawn-border {
            border: 3px solid var(--color-border);
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            transition: all 0.3s ease;
        }
        
        .hand-drawn-border:hover {
            border-radius: 15px 255px 15px 225px/225px 15px 255px 15px;
        }

        /* 隱藏卷軸但保持可滾動 */
        textarea::-webkit-scrollbar { width: 6px; }
        textarea::-webkit-scrollbar-track { background: transparent; }
        textarea::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 20px;
        }

        /* SVG 圖示動畫 */
        .wheel-character {
            transform-origin: center;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .wheel-group:hover .wheel-character {
            transform: scale(1.15) rotate(5deg);
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.15));
        }
        
        .active-segment .wheel-character {
            transform: scale(1.25);
            filter: drop-shadow(0 0 12px rgba(255,255,255,0.8));
        }

        /* 卡片彈出動畫 */
        @keyframes popIn {
            0% { opacity: 0; transform: translateY(20px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .card-animate {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .card-delay-1 { animation-delay: 0.1s; opacity: 0; }
        .card-delay-2 { animation-delay: 0.2s; opacity: 0; }
        .card-delay-3 { animation-delay: 0.3s; opacity: 0; }

    </style>
</head>
<body id="app-body" class="min-h-screen flex flex-col py-6 px-4 md:px-8 relative overflow-x-hidden font-sans">

    <!-- SVG 定義區：角色插圖 (手繪風格) -->
    <svg width="0" height="0" class="hidden">
        <defs>
            <!-- 共有樣式 -->
            <style>
                .svg-stroke { stroke: var(--color-border); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
                .svg-fill-white { fill: #fff; }
                .svg-eyes { fill: var(--color-border); }
            </style>
            
            <!-- 1. 生氣 (紅色火山小怪獸) -->
            <g id="char-angry">
                <path d="M-20,25 L-15,-5 L-5,-15 L5,-5 L15,-15 L20,25 Z" fill="var(--color-angry)" class="svg-stroke" />
                <path d="M-15,-5 L-5,5 L5,-5 L15,5" fill="none" class="svg-stroke" stroke-width="1.5"/> <!-- 岩漿 -->
                <path d="M-8,12 L-3,16" class="svg-stroke" /> <!-- 左怒眉 -->
                <path d="M8,12 L3,16" class="svg-stroke" /> <!-- 右怒眉 -->
                <circle cx="-5" cy="18" r="2" class="svg-eyes" />
                <circle cx="5" cy="18" r="2" class="svg-eyes" />
                <path d="M-3,22 Q0,19 3,22" fill="none" class="svg-stroke" /> <!-- 嘴巴 -->
                <path d="M-10,-20 Q-5,-30 5,-25" fill="none" class="svg-stroke" stroke-dasharray="2 4"/> <!-- 煙霧 -->
            </g>

            <!-- 2. 傷心 (藍色抱著雨滴的小雲朵) -->
            <g id="char-sad">
                <path d="M-15,15 A12,12 0 0,1 -10,-5 A15,15 0 0,1 15,-5 A12,12 0 0,1 20,15 A10,10 0 0,1 10,25 L-5,25 A10,10 0 0,1 -15,15 Z" fill="var(--color-sad)" class="svg-stroke" />
                <circle cx="-5" cy="10" r="2" class="svg-eyes" />
                <circle cx="7" cy="10" r="2" class="svg-eyes" />
                <path d="M-1,16 Q1,14 3,16" fill="none" class="svg-stroke" /> <!-- 委屈嘴 -->
                <path d="M-6,12 L-6,14" fill="none" class="svg-stroke" stroke-width="1.5"/> <!-- 眼淚 -->
                <!-- 手抱雨滴 -->
                <path d="M5,22 C5,18 12,18 12,22 C12,26 5,26 5,22 Z" fill="#fff" class="svg-stroke" stroke-width="1.5"/>
            </g>

            <!-- 3. 擔心 (紫色捧著問號的小兔子) -->
            <g id="char-worried">
                <ellipse cx="-6" cy="-15" rx="4" ry="12" transform="rotate(-15 -6 -15)" fill="var(--color-worried)" class="svg-stroke" /> <!-- 左耳 -->
                <ellipse cx="6" cy="-15" rx="4" ry="12" transform="rotate(15 6 -15)" fill="var(--color-worried)" class="svg-stroke" /> <!-- 右耳 -->
                <circle cx="0" cy="8" r="16" fill="var(--color-worried)" class="svg-stroke" /> <!-- 臉 -->
                <circle cx="-5" cy="5" r="2" class="svg-eyes" />
                <circle cx="5" cy="5" r="2" class="svg-eyes" />
                <ellipse cx="0" cy="12" rx="2" ry="1" class="svg-eyes" /> <!-- 鼻子 -->
                <!-- 問號 -->
                <text x="12" y="-5" font-family="Mali, cursive" font-weight="bold" font-size="20" fill="var(--color-border)" transform="rotate(15)">?</text>
                <path d="M-8,0 Q-5,-3 -2,0" fill="none" class="svg-stroke" stroke-width="1"/> <!-- 擔憂眉毛 -->
                <path d="M8,0 Q5,-3 2,0" fill="none" class="svg-stroke" stroke-width="1"/>
            </g>

            <!-- 4. 平靜 (綠色坐在水面上的小熊) -->
            <g id="char-calm">
                <circle cx="-12" cy="-8" r="5" fill="var(--color-calm)" class="svg-stroke" /> <!-- 左耳 -->
                <circle cx="12" cy="-8" r="5" fill="var(--color-calm)" class="svg-stroke" /> <!-- 右耳 -->
                <rect x="-16" y="-5" width="32" height="28" rx="14" fill="var(--color-calm)" class="svg-stroke" /> <!-- 臉/身體 -->
                <path d="M-6,8 Q-3,10 0,8" fill="none" class="svg-stroke" stroke-width="1.5"/> <!-- 左閉眼 -->
                <path d="M6,8 Q3,10 0,8" fill="none" class="svg-stroke" stroke-width="1.5"/> <!-- 右閉眼 -->
                <ellipse cx="0" cy="14" rx="3" ry="2" class="svg-eyes" /> <!-- 鼻子 -->
                <path d="M0,16 L0,18" fill="none" class="svg-stroke" stroke-width="1.5"/>
                <path d="M-20,25 Q-10,20 0,25 T20,25" fill="none" class="svg-stroke" stroke-width="1.5"/> <!-- 水波紋 -->
            </g>

            <!-- 5. 希望 (黃色抱著星星的小狐狸) -->
            <g id="char-hopeful">
                <path d="M-15,-10 L-8,5 L-20,5 Z" fill="var(--color-hopeful)" class="svg-stroke" /> <!-- 左耳 -->
                <path d="M15,-10 L8,5 L20,5 Z" fill="var(--color-hopeful)" class="svg-stroke" /> <!-- 右耳 -->
                <path d="M-20,5 Q0,25 20,5 L0,-5 Z" fill="var(--color-hopeful)" class="svg-stroke" /> <!-- 臉 -->
                <path d="M-8,5 Q-5,2 -2,5" fill="none" class="svg-stroke" stroke-width="2"/> <!-- 笑眼 -->
                <path d="M8,5 Q5,2 2,5" fill="none" class="svg-stroke" stroke-width="2"/>
                <circle cx="0" cy="12" r="2" class="svg-eyes" /> <!-- 鼻子 -->
                <!-- 星星 -->
                <polygon points="0,-18 3,-10 10,-10 4,-5 6,3 0,-2 -6,3 -4,-5 -10,-10 -3,-10" fill="#fff" stroke="var(--color-border)" stroke-width="1.5" transform="translate(15, -5) scale(0.6) rotate(15)" />
            </g>
        </defs>
    </svg>

    <!-- 頂部區塊 -->
    <header class="w-full max-w-5xl mx-auto flex flex-col md:flex-row justify-between items-center mb-6 z-10 gap-4">
        <div class="text-center md:text-left">
            <h1 class="text-3xl md:text-4xl font-black mb-1 font-hand tracking-wide">🧭 心情小導航</h1>
            <p class="text-base font-medium opacity-80 font-hand">轉一轉，找到照顧自己的方法</p>
        </div>

        <!-- 模式切換 -->
        <div class="flex bg-white/50 backdrop-blur rounded-full p-1.5 shadow-inner hand-drawn-border border-2">
            <button id="btn-kid" class="px-4 py-1.5 rounded-full text-sm font-bold transition-all duration-300 bg-[var(--color-bg)] shadow-sm text-slate-800 border-2 border-[var(--color-border)]">
                👧 小學生模式
            </button>
            <button id="btn-adult" class="px-4 py-1.5 rounded-full text-sm font-bold transition-all duration-300 text-slate-500 hover:text-slate-700 border-2 border-transparent">
                🧑 大人模式
            </button>
        </div>
    </header>

    <!-- 主要內容區：分為左右兩欄 (桌機) 或 上下兩欄 (手機) -->
    <main class="w-full max-w-5xl mx-auto flex flex-col lg:flex-row gap-8 lg:gap-12 flex-grow z-10 items-center lg:items-start">
        
        <!-- 左側：輸入對話泡泡 & 方向盤 -->
        <div class="w-full lg:w-[45%] flex flex-col items-center">
            
            <!-- 手繪對話泡泡 (輸入區) -->
            <div class="w-full mb-6 relative">
                <div class="bg-white p-5 hand-drawn-border shadow-hand relative z-10">
                    <label for="event-input" class="block text-base md:text-lg font-bold font-hand mb-2 flex items-center gap-2">
                        💬 今天發生了什麼事？
                    </label>
                    <textarea id="event-input" class="w-full h-24 resize-none bg-transparent text-base md:text-lg focus:outline-none placeholder-slate-400 font-medium" placeholder="把心裡的故事告訴我吧...&#10;(例如：同學嘲笑我畫的畫、明天要上台報告很緊張)"></textarea>
                </div>
                <!-- 對話泡泡的小尾巴 -->
                <div class="absolute -bottom-4 left-1/2 -translate-x-1/2 w-8 h-8 bg-white border-b-3 border-r-3 border-[var(--color-border)] rotate-45 z-0" style="border-width: 0 3px 3px 0;"></div>
            </div>

            <!-- 方向盤主體 -->
            <div class="w-full max-w-[340px] md:max-w-[380px] aspect-square relative mt-2">
                <!-- 指示箭頭 -->
                <div class="absolute -top-6 left-1/2 -translate-x-1/2 w-8 h-8 drop-shadow-md z-30 pointer-events-none">
                    <svg viewBox="0 0 24 24" fill="var(--color-border)" class="w-full h-full">
                        <path d="M12 2L22 20H2L12 2Z" />
                    </svg>
                </div>
                
                <!-- SVG 方向盤容器 -->
                <div id="wheel-container" class="w-full h-full relative transition-transform duration-700 ease-[cubic-bezier(0.25,1,0.5,1)] origin-center">
                    <svg id="wheel-svg" viewBox="-110 -110 220 220" class="w-full h-full overflow-visible drop-shadow-xl"></svg>
                </div>
                
                <!-- 中心裝飾 (遮住扇形交界) -->
                <div class="absolute inset-0 m-auto w-16 h-16 bg-white rounded-full z-20 hand-drawn-border flex items-center justify-center shadow-inner">
                    <span class="text-2xl font-bold font-hand opacity-50">♥</span>
                </div>
            </div>
            
            <p class="mt-6 text-sm md:text-base font-bold font-hand text-center text-slate-500 animate-pulse">
                👆 寫下發生的事，然後點擊與你感受最像的顏色！
            </p>
        </div>

        <!-- 右側：結果展示儀表板 (三張卡片) -->
        <div id="output-dashboard" class="w-full lg:w-[55%] flex flex-col">
            
            <!-- 預設/空白狀態 -->
            <div id="output-placeholder" class="h-full flex flex-col items-center justify-center text-center p-8 bg-white/40 hand-drawn-border border-dashed min-h-[300px]">
                <span class="text-4xl mb-4 opacity-50">✨</span>
                <p class="text-lg font-hand font-bold text-slate-500">準備好照顧自己了嗎？</p>
                <p class="text-sm font-medium text-slate-400 mt-2">在左邊寫下故事並轉動方向盤，<br>為你量身打造的專屬行動就會出現在這裡。</p>
            </div>

            <!-- 載入中動畫 -->
            <div id="loading-indicator" class="hidden h-full flex flex-col items-center justify-center py-12 text-center min-h-[300px]">
                <div class="w-16 h-16 relative animate-spin mb-4">
                    <svg viewBox="0 0 100 100" class="w-full h-full">
                        <circle cx="50" cy="50" r="40" fill="none" stroke="var(--color-border)" stroke-width="4" stroke-dasharray="100 50" class="opacity-50" />
                        <circle cx="50" cy="50" r="20" fill="none" stroke="var(--color-hopeful)" stroke-width="4" stroke-dasharray="40 20" />
                    </svg>
                </div>
                <p class="text-base md:text-lg font-hand font-bold animate-pulse">正在為你編寫專屬的小方法...</p>
            </div>

            <!-- 實際內容區塊 (三張卡片) -->
            <div id="output-content" class="hidden flex-col gap-4">
                <!-- 溫暖回饋詞 -->
                <div class="bg-white/80 p-4 hand-drawn-border mb-2 text-center shadow-sm">
                    <p id="empathy-message" class="text-lg font-bold font-hand text-[var(--color-border)]"></p>
                </div>

                <!-- 1. 正念/身體卡片 -->
                <div class="card-animate card-delay-1 bg-white p-5 hand-drawn-border shadow-hand hover:shadow-hand-hover hover:translate-y-[2px] transition-all relative overflow-hidden">
                    <div class="absolute -right-6 -top-6 w-20 h-20 bg-[var(--color-green)] opacity-20 rounded-full blur-xl pointer-events-none"></div>
                    <div class="flex items-center gap-3 mb-3">
                        <span class="text-2xl bg-[var(--color-green)] w-10 h-10 rounded-full flex items-center justify-center border-2 border-[var(--color-border)] shadow-sm">🍃</span>
                        <h3 id="card-mindfulness-title" class="text-lg font-bold font-hand"></h3>
                    </div>
                    <ul id="card-mindfulness-steps" class="list-none space-y-2 text-base font-medium pl-2"></ul>
                </div>

                <!-- 2. 藝術治療卡片 -->
                <div class="card-animate card-delay-2 bg-white p-5 hand-drawn-border shadow-hand hover:shadow-hand-hover hover:translate-y-[2px] transition-all relative overflow-hidden">
                    <div class="absolute -right-6 -top-6 w-20 h-20 bg-[var(--color-yellow)] opacity-20 rounded-full blur-xl pointer-events-none"></div>
                    <div class="flex items-center gap-3 mb-3">
                        <span class="text-2xl bg-[var(--color-yellow)] w-10 h-10 rounded-full flex items-center justify-center border-2 border-[var(--color-border)] shadow-sm">🎨</span>
                        <h3 id="card-art-title" class="text-lg font-bold font-hand"></h3>
                    </div>
                    <ul id="card-art-steps" class="list-none space-y-2 text-base font-medium pl-2"></ul>
                </div>

                <!-- 3. 心理/正向心理卡片 -->
                <div class="card-animate card-delay-3 bg-white p-5 hand-drawn-border shadow-hand hover:shadow-hand-hover hover:translate-y-[2px] transition-all relative overflow-hidden">
                    <div class="absolute -right-6 -top-6 w-20 h-20 bg-[var(--color-blue)] opacity-20 rounded-full blur-xl pointer-events-none"></div>
                    <div class="flex items-center gap-3 mb-3">
                        <span class="text-2xl bg-[var(--color-blue)] w-10 h-10 rounded-full flex items-center justify-center border-2 border-[var(--color-border)] shadow-sm">💡</span>
                        <h3 id="card-psychology-title" class="text-lg font-bold font-hand"></h3>
                    </div>
                    <ul id="card-psychology-steps" class="list-none space-y-2 text-base font-medium pl-2"></ul>
                </div>
            </div>

        </div>
    </main>

    <!-- 底部版權與免責聲明 -->
    <footer class="mt-12 pt-6 pb-4 w-full text-center z-10 relative border-t-2 border-slate-300/50">
        <div class="mb-3">
            <span class="inline-block bg-white/70 backdrop-blur px-5 py-1.5 hand-drawn-border font-bold font-hand text-sm shadow-sm">
                設計者：大忠國小 陳佳慧 老師
            </span>
        </div>
        <p class="text-xs font-medium text-slate-500 px-4">
            ※ 本工具為自我覺察與教育引導用途，所提供之建議非醫療診斷或專業心理治療。
        </p>
    </footer>

    <!-- JavaScript 邏輯區 -->
    <script>
        // 定義情緒與資料
        const emotions = [
            { id: 'angry',   colorVar: '--color-angry',   name: '生氣', charId: '#char-angry' },
            { id: 'hopeful', colorVar: '--color-hopeful', name: '希望', charId: '#char-hopeful' },
            { id: 'calm',    colorVar: '--color-calm',    name: '平靜', charId: '#char-calm' },
            { id: 'sad',     colorVar: '--color-sad',     name: '傷心', charId: '#char-sad' },
            { id: 'worried', colorVar: '--color-worried', name: '擔心', charId: '#char-worried' }
        ];

        // DOM 元素參考
        const svgContainer = document.getElementById('wheel-svg');
        const wheelContainer = document.getElementById('wheel-container');
        const eventInput = document.getElementById('event-input');
        const btnKid = document.getElementById('btn-kid');
        const btnAdult = document.getElementById('btn-adult');
        
        // 狀態管理
        let currentMode = 'kid'; // 'kid' 或 'adult'
        let selectedEmotionId = null;
        let currentRotation = 0;
        let typingTimer;

        // 繪製方向盤
        function renderWheel() {
            svgContainer.innerHTML = ''; // 清空
            const rOuter = 100;
            const rInner = 20; // 中間留空
            const angleSpan = 360 / emotions.length; // 72度
            
            // 讓第一個(生氣)正對上方
            let currentAngle = -90 - (angleSpan / 2);

            emotions.forEach((emo, index) => {
                const startAngle = currentAngle;
                const endAngle = currentAngle + angleSpan;
                const midAngle = startAngle + (angleSpan / 2);

                // 計算路徑 (手繪感稍微增加控制點或保持圓弧但邊線粗)
                // 為了簡化並確保響應式效能，使用標準 SVG Arc，依靠 CSS border 達成手繪感
                const x1 = rOuter * Math.cos(Math.PI * startAngle / 180);
                const y1 = rOuter * Math.sin(Math.PI * startAngle / 180);
                const x2 = rOuter * Math.cos(Math.PI * endAngle / 180);
                const y2 = rOuter * Math.sin(Math.PI * endAngle / 180);
                
                const ix1 = rInner * Math.cos(Math.PI * startAngle / 180);
                const iy1 = rInner * Math.sin(Math.PI * startAngle / 180);
                const ix2 = rInner * Math.cos(Math.PI * endAngle / 180);
                const iy2 = rInner * Math.sin(Math.PI * endAngle / 180);

                const d = `M ${ix1} ${iy1} L ${x1} ${y1} A ${rOuter} ${rOuter} 0 0 1 ${x2} ${y2} L ${ix2} ${iy2} A ${rInner} ${rInner} 0 0 0 ${ix1} ${iy1} Z`;

                // 建立群組
                const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
                group.setAttribute("class", "cursor-pointer wheel-group group");
                
                // 建立扇形底色
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", d);
                path.setAttribute("fill", `var(${emo.colorVar})`);
                path.setAttribute("stroke", "var(--color-border)");
                path.setAttribute("stroke-width", "3");
                path.setAttribute("stroke-linejoin", "round");
                path.setAttribute("class", "transition-all duration-200 opacity-90 group-hover:opacity-100 group-hover:stroke-[4px]");

                // 建立角色容器與文字
                const textR = rOuter * 0.65; // 角色半徑位置
                const tx = textR * Math.cos(Math.PI * midAngle / 180);
                const ty = textR * Math.sin(Math.PI * midAngle / 180);
                
                // 讓文字/圖示始終朝上或順著圓形。這裡我們讓它順著半徑向外
                const textRotation = midAngle + 90;

                const charUse = document.createElementNS("http://www.w3.org/2000/svg", "use");
                charUse.setAttribute("href", emo.charId);
                // 置中偏移 (假設角色設計約在 origin 附近)
                charUse.setAttribute("transform", `translate(${tx}, ${ty}) rotate(${textRotation}) scale(0.9)`);
                charUse.setAttribute("class", "wheel-character pointer-events-none");

                // 情緒名稱文字 (放在邊緣)
                const nameR = rOuter * 0.9;
                const nx = nameR * Math.cos(Math.PI * midAngle / 180);
                const ny = nameR * Math.sin(Math.PI * midAngle / 180);
                const nameText = document.createElementNS("http://www.w3.org/2000/svg", "text");
                nameText.setAttribute("x", nx);
                nameText.setAttribute("y", ny);
                nameText.setAttribute("text-anchor", "middle");
                nameText.setAttribute("dominant-baseline", "middle");
                nameText.setAttribute("class", "pointer-events-none font-hand font-bold");
                nameText.setAttribute("fill", "var(--color-border)");
                nameText.setAttribute("font-size", "14");
                nameText.setAttribute("transform", `rotate(${textRotation}, ${nx}, ${ny})`);
                nameText.textContent = emo.name;

                // 綁定事件
                group.appendChild(path);
                group.appendChild(charUse);
                group.appendChild(nameText);
                
                group.addEventListener("click", () => handleWheelClick(index));
                
                // 用來控制啟動狀態的 class
                group.id = `segment-${index}`;

                svgContainer.appendChild(group);

                currentAngle += angleSpan;
            });
        }

        function handleWheelClick(targetIndex) {
            const emo = emotions[targetIndex];
            selectedEmotionId = emo.id;

            // 處理旋轉動畫
            const targetRotation = - (targetIndex * 72);
            let normalizedCurrent = currentRotation % 360;
            if (normalizedCurrent > 0) normalizedCurrent -= 360; 

            let diff = targetRotation - normalizedCurrent;
            if (diff > 180) diff -= 360;
            if (diff < -180) diff += 360;

            currentRotation += diff;
            wheelContainer.style.transform = `rotate(${currentRotation}deg)`;

            // 更新視覺狀態
            document.querySelectorAll('.wheel-group').forEach(el => el.classList.remove('active-segment'));
            document.getElementById(`segment-${targetIndex}`).classList.add('active-segment');

            // 觸發內容更新
            generateContent();
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag])
            );
        }

        // 本地備案生成 (防止無網路或 API 錯誤)
        function generateLocalFallback(eventText, emotionName, mode) {
            const isKid = mode === 'kid';
            const safeEvent = escapeHTML(eventText) || "這件事";
            
            // 簡單的關鍵字變化
            const artAction = isKid 
                ? `找一張廢紙，用最深的顏色把「${safeEvent}」帶來的感覺用力畫出來，然後把它撕碎丟掉！`
                : `將關於「${safeEvent}」的情緒，用色彩或抽象線條自由塗鴉在紙上，將內在感受具象化並釋放。`;
                
            const psychAction = isKid
                ? `告訴自己：「雖然發生了${safeEvent}，但我還是個很棒的小孩，我可以試著找老師或朋友幫忙。」`
                : `認知重構練習：寫下關於「${safeEvent}」的三個客觀事實，區分事實與大腦編造的焦慮故事。`;

            return {
                empathy_message: isKid ? `聽到你說遇到「${safeEvent}」，覺得${emotionName}，我懂這種感覺喔！` : `面對「${safeEvent}」而感到${emotionName}，是很正常的反應，辛苦你了。`,
                mindfulness_title: "身體覺察與放鬆",
                mindfulness_steps: [
                    "找一個安全安靜的地方坐下。",
                    isKid ? "跟著呼吸，在心裡慢慢從 1 數到 10。" : "進行 4-7-8 呼吸法（吸4秒、憋7秒、吐8秒）。",
                    "把雙手放在肚子上，感覺肚子的起伏。"
                ],
                art_title: "藝術表達",
                art_steps: [ artAction, "做完後，給自己一個大大的深呼吸。" ],
                psychology_title: "轉念與行動",
                psychology_steps: [ psychAction, "挑選一個可以立刻執行的第一步，現在就去試試看！" ]
            };
        }

        async function fetchAIContent(eventText, emotionData, mode) {
            const apiKey = ""; // Canvas 平台自動注入
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            const audience = mode === 'kid' ? '國小學生 (需要具體、有趣、具象化、好懂的引導)' : '成年人 (需要深度覺察、客觀、成熟的認知重構)';
            const inputContext = eventText.trim() ? `事件細節：「${eventText}」` : "使用者未具體說明事件，請給予通用但具體的引導";

            const systemPrompt = `你是一位專業的心理諮商師與藝術治療師。
任務：根據使用者的事件、當下情緒與年齡層，提供高度客製化的「三張具體行動建議卡片」。
規則：
1. 必須深刻分析事件細節，產出的建議必須【直接引用或回應事件】，不可使用通用模板。
2. 步驟必須具體、可觀察、可執行 (例如不要只說"深呼吸"，要說"吸氣4秒吐氣8秒")。
3. 藝術治療不可每次都是撕紙，請根據情境變化(如黏土、畫情緒地圖、色彩塗鴉、音樂節奏等)。
4. 語氣需符合對象：${audience}。
5. 必須嚴格遵守 JSON schema 輸出，不加 markdown \`\`\`json 標籤，直接回傳 JSON 字串。`;

            const userPrompt = `${inputContext}\n當下情緒：${emotionData.name}\n對象：${audience}`;

            const payload = {
                contents: [{ parts: [{ text: userPrompt }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] },
                generationConfig: { 
                    temperature: 0.7,
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "OBJECT",
                        properties: {
                            "empathy_message": { type: "STRING" },
                            "mindfulness_title": { type: "STRING" },
                            "mindfulness_steps": { type: "ARRAY", items: { type: "STRING" } },
                            "art_title": { type: "STRING" },
                            "art_steps": { type: "ARRAY", items: { type: "STRING" } },
                            "psychology_title": { type: "STRING" },
                            "psychology_steps": { type: "ARRAY", items: { type: "STRING" } }
                        },
                        required: ["empathy_message", "mindfulness_title", "mindfulness_steps", "art_title", "art_steps", "psychology_title", "psychology_steps"]
                    }
                }
            };

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                if (result.candidates && result.candidates.length > 0) {
                    let jsonText = result.candidates[0].content.parts[0].text;
                    return JSON.parse(jsonText);
                }
                throw new Error("Invalid API response");
            } catch (error) {
                console.error("AI 請求失敗，使用本地備案", error);
                return generateLocalFallback(eventText, emotionData.name, mode);
            }
        }

        function renderCards(data) {
            document.getElementById('empathy-message').textContent = data.empathy_message;
            
            const fillCard = (idPrefix, title, steps) => {
                document.getElementById(`${idPrefix}-title`).textContent = title;
                const ul = document.getElementById(`${idPrefix}-steps`);
                ul.innerHTML = '';
                steps.forEach(step => {
                    const li = document.createElement('li');
                    li.className = "relative pl-5 before:content-[''] before:absolute before:left-0 before:top-[8px] before:w-2 before:h-2 before:bg-[var(--color-border)] before:rounded-full before:opacity-50";
                    li.textContent = step;
                    ul.appendChild(li);
                });
                // 重置動畫
                const card = document.getElementById(`${idPrefix}-title`).closest('.card-animate');
                card.style.animation = 'none';
                card.offsetHeight; // trigger reflow
                card.style.animation = null;
            };

            fillCard('card-mindfulness', data.mindfulness_title, data.mindfulness_steps);
            fillCard('card-art', data.art_title, data.art_steps);
            fillCard('card-psychology', data.psychology_title, data.psychology_steps);
        }

        async function generateContent() {
            if (!selectedEmotionId) return;

            const emoData = emotions.find(e => e.id === selectedEmotionId);
            const userInput = eventInput.value;

            // UI 狀態切換
            document.getElementById('output-placeholder').classList.add('hidden');
            document.getElementById('output-content').classList.add('hidden');
            document.getElementById('loading-indicator').classList.remove('hidden');

            const resultData = await fetchAIContent(userInput, emoData, currentMode);

            document.getElementById('loading-indicator').classList.add('hidden');
            document.getElementById('output-content').classList.remove('hidden');
            document.getElementById('output-content').style.display = 'flex'; // override hidden flex-col issue
            
            renderCards(resultData);
        }

        // 綁定輸入框 Debounce
        eventInput.addEventListener('input', () => {
            if (selectedEmotionId) {
                clearTimeout(typingTimer);
                typingTimer = setTimeout(generateContent, 1500);
            }
        });

        // 模式切換邏輯
        function setMode(mode) {
            currentMode = mode;
            const body = document.getElementById('app-body');
            
            if (mode === 'kid') {
                body.classList.remove('mode-adult');
                btnKid.className = "px-4 py-1.5 rounded-full text-sm font-bold transition-all duration-300 bg-[var(--color-bg)] shadow-sm text-slate-800 border-2 border-[var(--color-border)] relative z-10";
                btnAdult.className = "px-4 py-1.5 rounded-full text-sm font-bold transition-all duration-300 text-slate-500 hover:text-slate-700 border-2 border-transparent relative z-0";
            } else {
                body.classList.add('mode-adult');
                btnAdult.className = "px-4 py-1.5 rounded-full text-sm font-bold transition-all duration-300 bg-[var(--color-bg)] shadow-sm text-slate-800 border-2 border-[var(--color-border)] relative z-10";
                btnKid.className = "px-4 py-1.5 rounded-full text-sm font-bold transition-all duration-300 text-slate-500 hover:text-slate-700 border-2 border-transparent relative z-0";
            }

            // 更新顏色變數與重新繪製方向盤 (因為顏色變了)
            renderWheel();
            
            // 恢復目前的選取狀態
            if (selectedEmotionId) {
                const targetIndex = emotions.findIndex(e => e.id === selectedEmotionId);
                const targetRotation = - (targetIndex * 72);
                currentRotation = targetRotation; // 重置旋轉角度
                wheelContainer.style.transform = `rotate(${currentRotation}deg)`;
                document.getElementById(`segment-${targetIndex}`).classList.add('active-segment');
                generateContent();
            }
        }

        btnKid.addEventListener('click', () => setMode('kid'));
        btnAdult.addEventListener('click', () => setMode('adult'));

        // 初始化
        window.onload = () => {
            renderWheel();
            setTimeout(() => eventInput.focus(), 500);
        };
    </script>
</body>
